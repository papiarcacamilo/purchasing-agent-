[project]
name = "cotizador-compras"
version = "0.1.0"
description = "Sistema de cotización y presupuesto de compra con LangGraph, LangChain y Pydantic"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.2",
    "langchain-core>=1.7",
    "langchain-openai>=1.7",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    # Para ejecutar notebooks/cotizador.ipynb (recorrido del sistema paso a paso).
    "ipykernel>=6.29",
]

[tool.uv]
# Es una aplicación (no una librería a publicar): uv solo gestiona el entorno.
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
